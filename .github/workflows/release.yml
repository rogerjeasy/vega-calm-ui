name: Release

# Publishes to npm when a GitHub release is published, with provenance: npm
# shows which commit and which workflow built the package. It publishes through
# npm's trusted publishing (OIDC): the package's trusted publisher on npmjs.com is
# this repository's release.yml, so no token is stored anywhere. Needs a release
# whose tag matches package.json's version (v0.1.2 for 0.1.2).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm 11
        # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
        run: npm install -g npm@11.21.0
      - name: Install
        run: npm ci --ignore-scripts
      - name: The tag is the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          test "$version" = "${GITHUB_REF_NAME}" || { echo "Release tag ${GITHUB_REF_NAME} is not ${version}"; exit 1; }
      - name: Verify
        run: npm run verify
      - name: Publish
        run: npm publish --provenance --access public
